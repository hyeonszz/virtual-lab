# 로컬 PostgreSQL 개발 환경
services:
  postgres:
    image: postgres:16-alpine
    container_name: virtual-lab-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # PC 포트에서 컨테이너 PostgreSQL 포트로 연결
      - "${POSTGRES_PORT}:5432"
    volumes:
      # 컨테이너를 다시 만들어도 DB 데이터를 보존
      - virtual-lab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # PostgreSQL 데이터 전용 Docker 볼륨
  virtual-lab-postgres-data:
